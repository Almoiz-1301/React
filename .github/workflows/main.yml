name: Orchestrator Feasibility

on:
  repository_dispatch:
    types: [jira_feature_request]
  workflow_dispatch:
    inputs:
      analysis_id:
        description: Optional analysis id
        required: false
      jira_issue_key:
        description: Jira issue key
        required: true
      jira_summary:
        description: Jira summary
        required: true
      jira_description:
        description: Jira description
        required: true
      jira_priority:
        description: Jira priority
        required: false
        default: Medium
      jira_labels:
        description: Jira labels as CSV/JSON string
        required: false
        default: ""

permissions:
  contents: read

env:
  # Comma-separated owner/repo list
  TARGET_REPOS: "Almoiz-1301/Plugins,Almoiz-1301/Python"
  EVENT_TYPE: jira_feature_request
  # Set to "true" for no-AI integration tests
  USE_SIMULATED_AGGREGATION: "true"
  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
  JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  GH_FANOUT_TOKEN: ${{ secrets.GH_FANOUT_TOKEN }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Jira payload
        id: payload
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "analysis_id=${{ github.event.client_payload.analysis_id }}" >> "$GITHUB_OUTPUT"
            echo "jira_issue_key=${{ github.event.client_payload.jira_issue_key }}" >> "$GITHUB_OUTPUT"
            echo "jira_summary<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.client_payload.jira_summary }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "jira_description<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.client_payload.jira_description }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "jira_priority=${{ github.event.client_payload.jira_priority }}" >> "$GITHUB_OUTPUT"
            echo "jira_labels=${{ github.event.client_payload.jira_labels }}" >> "$GITHUB_OUTPUT"
          else
            echo "analysis_id=${{ inputs.analysis_id }}" >> "$GITHUB_OUTPUT"
            echo "jira_issue_key=${{ inputs.jira_issue_key }}" >> "$GITHUB_OUTPUT"
            echo "jira_summary<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ inputs.jira_summary }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "jira_description<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ inputs.jira_description }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "jira_priority=${{ inputs.jira_priority }}" >> "$GITHUB_OUTPUT"
            echo "jira_labels=${{ inputs.jira_labels }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure analysis id exists
        id: idgen
        run: |
          aid="${{ steps.payload.outputs.analysis_id }}"
          if [ -z "$aid" ]; then
            aid="${{ steps.payload.outputs.jira_issue_key }}-${{ github.run_id }}"
          fi
          echo "analysis_id=$aid" >> "$GITHUB_OUTPUT"

      - name: Fan out dispatch to spoke repos
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_FANOUT_TOKEN"].strip()
          if not token:
              raise RuntimeError("GH_FANOUT_TOKEN is missing")

          repos = [r.strip() for r in os.environ["TARGET_REPOS"].split(",") if r.strip()]
          payload = {
              "event_type": os.environ["EVENT_TYPE"],
              "client_payload": {
                  "analysis_id": os.environ["ANALYSIS_ID"],
                  "jira_issue_key": os.environ["JIRA_ISSUE_KEY"],
                  "jira_summary": os.environ["JIRA_SUMMARY"],
                  "jira_description": os.environ["JIRA_DESCRIPTION"],
                  "jira_priority": os.environ["JIRA_PRIORITY"],
                  "jira_labels": os.environ["JIRA_LABELS"],
              },
          }
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          for repo in repos:
              url = f"https://api.github.com/repos/{repo}/dispatches"
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              with urllib.request.urlopen(req) as resp:
                  print(f"Dispatched {repo}, status={resp.status}")
          PY
        env:
          ANALYSIS_ID: ${{ steps.idgen.outputs.analysis_id }}
          JIRA_ISSUE_KEY: ${{ steps.payload.outputs.jira_issue_key }}
          JIRA_SUMMARY: ${{ steps.payload.outputs.jira_summary }}
          JIRA_DESCRIPTION: ${{ steps.payload.outputs.jira_description }}
          JIRA_PRIORITY: ${{ steps.payload.outputs.jira_priority }}
          JIRA_LABELS: ${{ steps.payload.outputs.jira_labels }}

      - name: Build aggregated report (simulation for v1)
        run: |
          mkdir -p out
          cat > out/final-assessment.json <<'EOF'
          {
            "overall_verdict": "partially_feasible",
            "impacted_repositories": ["Almoiz-1310/Plugins", "Almoiz-1310/AnotherRepo"],
            "impacted_components": ["api", "ui", "integration"],
            "overall_effort_estimate": {"size": "L", "rationale": "Cross-repo coordination required."},
            "cross_repo_risks": [
              {"severity": "high", "type": "architecture", "detail": "Shared contracts may need changes in more than one service."}
            ],
            "open_questions": [
              "Which repository should own the new shared interface?",
              "Should rollout be phased by repository?"
            ],
            "overall_confidence_score": 78,
            "incomplete_repositories": []
          }
          EOF

      - name: Render Jira comment
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("out/final-assessment.json").read_text())
          lines = [
              "h3. Multi-Repo AI Feasibility Assessment",
              "",
              f"*Overall Verdict:* {data['overall_verdict']}",
              f"*Impacted Repositories:* {', '.join(data['impacted_repositories'])}",
              f"*Impacted Components:* {', '.join(data['impacted_components'])}",
              f"*Effort:* {data['overall_effort_estimate']['size']} - {data['overall_effort_estimate']['rationale']}",
              "",
              "*Cross-Repo Risks:*",
          ]
          lines.extend([f"- [{r['severity']}] {r['type']}: {r['detail']}" for r in data["cross_repo_risks"]])
          lines.extend([
              "",
              "*Open Questions:*",
          ])
          lines.extend([f"- {q}" for q in data["open_questions"]])
          lines.extend([
              "",
              f"*Confidence Score:* {data['overall_confidence_score']}",
              f"*Orchestrator Run:* https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "",
          ])
          comment = "\n".join(lines)
          Path("out/jira-comment.md").write_text(comment, encoding="utf-8")
          PY

      - name: Post one Jira comment
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          issue_key = os.environ["JIRA_ISSUE_KEY"]
          base_url = os.environ["JIRA_BASE_URL"].rstrip("/")
          email = os.environ["JIRA_USER_EMAIL"]
          token = os.environ["JIRA_API_TOKEN"]
          comment_text = open("out/jira-comment.md", "r", encoding="utf-8").read()

          body = json.dumps({
              "body": {
                  "type": "doc",
                  "version": 1,
                  "content": [
                      {"type": "paragraph", "content": [{"type": "text", "text": comment_text}]}
                  ]
              }
          }).encode("utf-8")

          auth = base64.b64encode(f"{email}:{token}".encode()).decode()
          req = urllib.request.Request(
              f"{base_url}/rest/api/3/issue/{issue_key}/comment",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Basic {auth}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              print(f"Posted Jira comment, status={resp.status}")
          PY
        env:
          JIRA_ISSUE_KEY: ${{ steps.payload.outputs.jira_issue_key }}

      - name: Upload orchestrator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-${{ steps.idgen.outputs.analysis_id }}
          path: out/
